version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: dim_platform
    columns:
      - name: platform_key
        tests:
          - not_null
          - unique

  - name: dim_publisher
    columns:
      - name: publisher_key
        tests:
          - not_null
          - unique

  - name: dim_keyword
    columns:
      - name: keyword_key
        tests:
          - not_null
          - unique

  - name: dim_sentiment
    columns:
      - name: sentiment_key
        tests:
          - not_null
          - unique

  - name: fct_mentions_sentiment
    columns:
      - name: mention_id
        tests:
          - not_null
          - unique
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: platform_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_platform')
                field: platform_key
      - name: publisher_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_publisher')
                field: publisher_key
      - name: keyword_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_keyword')
                field: keyword_key
      - name: sentiment_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sentiment')
                field: sentiment_key